        <section>
            <h2>İletişim</h2>
            <p>Sorularınız veya talepleriniz için aşağıdaki formu doldurabilirsiniz, en kısa sürede size dönüş yapacağız.</p>

           <form action="https://formspree.io/f/xoeqdldn" method="POST" class="iletisim-form">
                <div class="form-grup">
                    <label for="ad">Ad Soyad</label>
                    <input type="text" id="ad" name="ad" required>
                </div>

                <div class="form-grup">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-grup">
                    <label for="konu">Konu</label>
                    <input type="text" id="konu" name="konu" required>
                </div>

               <div class="form-grup">
    <label for="mesaj">Mesajınız</label>
    <textarea id="mesaj" name="mesaj" rows="6" required></textarea>
</div>

<button type="submit" class="form-buton">Gönder</button>
